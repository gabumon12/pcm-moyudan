# Render Blueprint: Web Service dari Dockerfile. Rahasia diisi di dashboard (sync: false).
services:
  - type: web
    name: pcm-moyudan
    runtime: docker
    plan: free
    healthCheckPath: /
    dockerCommand: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - {key: DEBUG, value: "False"}
      - {key: SECRET_KEY, sync: false}
      - {key: DATABASE_URL, sync: false}
      - {key: ALLOWED_HOSTS, sync: false}
      - {key: CSRF_TRUSTED_ORIGINS, sync: false}
      - {key: AWS_STORAGE_BUCKET_NAME, sync: false}
      - {key: AWS_ACCESS_KEY_ID, sync: false}
      - {key: AWS_SECRET_ACCESS_KEY, sync: false}
      - {key: AWS_S3_ENDPOINT_URL, sync: false}
      - {key: AWS_S3_REGION_NAME, sync: false}
      - {key: AWS_S3_CUSTOM_DOMAIN, sync: false}
