# Jalankan: docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pcm
      POSTGRES_USER: pcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcm-lokal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm -d pcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Nilai di bawah hanya untuk Docker lokal; produksi diatur di dashboard platform.
      SECRET_KEY: ${SECRET_KEY:-kunci-docker-lokal-jangan-dipakai-di-produksi}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: postgres://pcm:${POSTGRES_PASSWORD:-pcm-lokal}@db:5432/pcm
      SERVE_MEDIA: "True"
      AWS_STORAGE_BUCKET_NAME: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:$${PORT:-8000} --workers 2 --access-logfile -"

volumes:
  pgdata:
  media:
